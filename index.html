<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ฟอร์มรับข้อมูล</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="register.css">
</head>
<body>

<div class="form-container">
  <form action="#" method="post">
    <h2>Register</h2>
    

    <div class="mb-3">
      <label for="input1" class="form-label">Employee</label>
      <input type="text" class="form-control" id="input1" name="input1" placeholder="กรอกรหัสพนักงานที่นี่" >
    </div>

    <div class="mb-3">
      <label for="input2" class="form-label">Firstname</label>
      <input type="text" class="form-control" id="input2" name="input2" placeholder="กรอกชื่อที่นี่" >
    </div>

    <div class="mb-3">
      <label for="input3" class="form-label">Lastname</label>
      <input type="text" class="form-control" id="input3" name="input3" placeholder="กรอกนามสกุลที่นี่" >
    </div>

    <div class="button-container">
      <button type="submit" class="btn btn-primary" id="submit" name="submit"; return false;">Submit</button>
      <button type="reset" class="btn btn-danger" id="cancel" name="cancel">Cancel</button>
    </div>
    
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script src="register.js"></script>
</body>
</html>
